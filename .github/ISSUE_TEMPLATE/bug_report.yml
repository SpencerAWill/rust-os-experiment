name: Bug report
description: Something does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do **not** open an issue; see [SECURITY.md](https://github.com/SpencerAWill/rust-os-experiment/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Cite the doc comment, spec section or ADR if you can.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A short program or failing test is ideal. It is also how this issue is verified as fixed.
      render: rust
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "`rustc --version`; OS and target (for example `aarch64-apple-darwin`); commit or version."
    validations:
      required: true

  - type: checkboxes
    id: assistant
    attributes:
      label: Drafting
      options:
        - label: An assistant drafted this issue.
